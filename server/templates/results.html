<ul class="bars">
  {% for bar in bars %}
  <li class="bar{% if bar.best %} best{% endif %}{% if bar.correct %} correct{% endif %}">
    <span class="label">{{ bar.label }}{% if bar.correct %}<span class="mark" title="správná odpověď">&#10003;</span>{% endif %}</span>
    <span class="graph"><span class="fill" style="width: {{ bar.width }}%"></span></span>
    <span class="count">{{ bar.count }}</span>
    <span class="share">{{ bar.share }}&nbsp;%</span>
    {% if show_answers %}<span class="text">{{ bar.html|safe }}</span>{% endif %}
  </li>
  {% endfor %}
</ul>
<p class="status count">Celkem odpovědí: <strong data-count>{{ answer_count }}</strong></p>
