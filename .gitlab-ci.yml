# Builds the binaries for Linux, macOS and Windows and keeps them as job
# artifacts, downloadable from the pipeline page or, for the newest build of
# a branch, from
#
#   https://gitlab.fel.cvut.cz/sojkam1/quiz/-/jobs/artifacts/main/download?job=<job name>
#
# A pipeline for a tag vX.Y.Z also publishes a release: it checks that the tag
# matches the version in Cargo.toml and has a section in CHANGELOG.md, uploads
# the binaries to the generic package registry, where they are kept for good,
# and creates a GitLab release with the changelog section and links to them.
# See RELEASING.md.
#
# A scheduled pipeline only runs security-update, which proposes updates of
# crates with known vulnerabilities in a merge request.
#
# Everything is cross-compiled on Linux with cargo-zigbuild, which uses Zig as
# the C compiler (the TLS library has C code) and the linker for every target.
# Its image comes with the Rust targets and with a macOS SDK, which the macOS
# build needs for the CoreFoundation framework (chrono reads the local time
# zone through it).

stages:
  - build
  - release

variables:
  PACKAGE_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/quiz/${CI_COMMIT_TAG}

.release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

# Runs before every other job (stage .pre), so a tag that does not match the
# version or lacks a changelog section uploads nothing.
check-release:
  extends: .release-tag
  stage: .pre
  image: alpine:3.20
  script:
    - version=${CI_COMMIT_TAG#v}
    - |
      if ! grep -qx "version = \"$version\"" Cargo.toml; then
        echo "The version in Cargo.toml is not $version" >&2
        exit 1
      fi
    # The section of the release, without its heading, up to the next one.
    - awk -v v="$version" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md > release-notes.md
    - |
      if ! grep -q '[^[:space:]]' release-notes.md; then
        echo "CHANGELOG.md has no section for $version" >&2
        exit 1
      fi
    - cat release-notes.md
  artifacts:
    paths:
      - release-notes.md

.build:
  stage: build
  rules:
    # Without the first rule, a merge request would run a second pipeline
    # next to the one of its branch.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  image: ghcr.io/rust-cross/cargo-zigbuild:0.23.4
  variables:
    # The packages to build; the server is only ever deployed on Linux.
    PACKAGES: -p quiz-cli
  script:
    - cargo zigbuild --release --locked $PACKAGES --target "$TARGET"
    # A glibc target carries the oldest glibc to link against after a dot,
    # which is not part of the output directory.
    #
    # The archive keeps the paths the files have in the project, so the
    # binaries are copied to its root to end up at the root of the archive.
    - cp $(for binary in $BINARIES; do echo "target/${TARGET%%.*}/release/$binary"; done) .
    - ls -l $BINARIES
    # For a release, upload the binaries to the package registry: in a
    # tar.gz, which keeps them executable, and the Windows one as it is.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        case $PLATFORM in
          windows-*) file=quiz-$CI_COMMIT_TAG-$PLATFORM.exe; cp quiz.exe "$file" ;;
          *) file=quiz-$CI_COMMIT_TAG-$PLATFORM.tar.gz; tar czf "$file" $BINARIES ;;
        esac
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$file" "$PACKAGE_URL/$file"
      fi
  artifacts:
    name: quiz-$PLATFORM-$CI_COMMIT_REF_SLUG
    # Every binary any of the jobs builds; each job only has some of them,
    # and GitLab merely warns about the others.
    paths:
      - quiz
      - quiz.exe
      - quiz-server
    expire_in: 3 months

build-linux-gnu:
  extends: .build
  variables:
    # Runs on any distribution with glibc 2.28 or newer (Debian 10, RHEL 8,
    # Ubuntu 18.10).
    TARGET: x86_64-unknown-linux-gnu.2.28
    PLATFORM: linux-x86_64-gnu
    PACKAGES: -p quiz-cli -p quiz-server
    BINARIES: quiz quiz-server

build-linux-musl:
  extends: .build
  variables:
    # Statically linked, runs on any Linux, Alpine included.
    TARGET: x86_64-unknown-linux-musl
    PLATFORM: linux-x86_64-musl
    PACKAGES: -p quiz-cli -p quiz-server
    BINARIES: quiz quiz-server

build-macos:
  extends: .build
  variables:
    # One binary for both Apple Silicon and Intel Macs.
    TARGET: universal2-apple-darwin
    PLATFORM: macos-universal
    BINARIES: quiz

build-windows:
  extends: .build
  variables:
    TARGET: x86_64-pc-windows-gnu
    PLATFORM: windows-x86_64
    BINARIES: quiz.exe

release:
  extends: .release-tag
  stage: release
  # Runs the release-cli after the script to create the release.
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: check-release
      artifacts: true
    - job: build-linux-gnu
      artifacts: false
    - job: build-linux-musl
      artifacts: false
    - job: build-macos
      artifacts: false
    - job: build-windows
      artifacts: false
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release-notes.md
    assets:
      links:
        - name: Linux x86_64, glibc 2.28+ (quiz, quiz-server)
          url: $PACKAGE_URL/quiz-$CI_COMMIT_TAG-linux-x86_64-gnu.tar.gz
          link_type: package
        - name: Linux x86_64, static (quiz, quiz-server)
          url: $PACKAGE_URL/quiz-$CI_COMMIT_TAG-linux-x86_64-musl.tar.gz
          link_type: package
        - name: macOS, Apple Silicon and Intel (quiz)
          url: $PACKAGE_URL/quiz-$CI_COMMIT_TAG-macos-universal.tar.gz
          link_type: package
        - name: Windows x86_64 (quiz.exe)
          url: $PACKAGE_URL/quiz-$CI_COMMIT_TAG-windows-x86_64.exe
          link_type: package

# Checks Cargo.lock against the RustSec advisory database and proposes the
# updates that fix vulnerabilities in a merge request from the branch
# security-updates; see scripts/security-update.sh. Fails when some
# vulnerability has no fix that it can apply.
#
# Set up once in the project settings:
#
# - Access tokens: a project access token with the Developer role and the
#   api and write_repository scopes.
# - CI/CD > Variables: SECURITY_UPDATE_TOKEN with the token, masked,
#   protected (so the branch main has to be protected) and with the
#   environment scope security-update. Without the scope, every job of a
#   pipeline on main would get the token, the builds too, which run the
#   build scripts of all dependencies.
# - Build > Pipeline schedules: a schedule for main, e.g. weekly.
security-update:
  stage: build
  image: alpine:3.22
  # Only for the environment-scoped token; the job deploys nothing.
  environment:
    name: security-update
    action: access
  rules:
    # Also in a pipeline started with "Run pipeline", which has to be on main
    # (or another protected branch) to get the protected token.
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  script:
    - apk add --no-cache cargo cargo-audit curl git jq
    - scripts/security-update.sh
