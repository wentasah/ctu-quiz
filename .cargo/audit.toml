# Configuration of cargo audit, which the CI job security-update runs too.

[advisories]
ignore = [
    # Marvin attack on rsa, which has no fixed version. It comes in through
    # openidconnect, and it needs a private key to be used: the server and
    # the CLI only verify ID tokens with the provider's public keys. Only
    # the mock identity provider in testsupport signs, with a test key.
    "RUSTSEC-2023-0071",

    # Multiple timing variability issues in operations intended to be
    # constant-time => This software is not that critical to consider
    # timing side-channel attacks important.
    "RUSTSEC-2026-0387",

    # bincode is unmaintained, but its authors consider 1.3.3 complete. It
    # comes in through syntect, whose parsing feature requires it, and the
    # latest syntect still depends on it.
    "RUSTSEC-2025-0141",
]
