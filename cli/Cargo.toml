[package]
name = "quiz-cli"
description = "Teacher's command line tool for asking questions with the quiz server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Writes the shell completion scripts while the CLI is compiled.
build = "build.rs"

[[bin]]
name = "quiz"
path = "src/main.rs"

[build-dependencies]
clap.workspace = true
clap_complete.workspace = true
url.workspace = true

[dependencies]
quiz-common.workspace = true

anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
csv = "1"
open = "5"
openidconnect.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
figment = { version = "0.10.19", features = ["toml"] }
etcetera = "0.10.0"

[dev-dependencies]
quiz-testsupport.workspace = true
# Only the tests spawn the compiled binary.
tokio = { version = "1", features = ["process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
