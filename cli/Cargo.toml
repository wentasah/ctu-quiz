[package]
name = "ctu-quiz"
description = "Teacher's command line tool for asking students questions in class with the ctu-quiz server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["quiz", "education", "classroom", "markdown", "oidc"]
categories = ["command-line-utilities"]
# Writes the shell completion scripts while the CLI is compiled.
build = "build.rs"

[[bin]]
name = "quiz"
path = "src/main.rs"

# Where `cargo binstall ctu-quiz` downloads the binaries from: the GitHub
# releases, whose file names have no Rust target triples in them.
[package.metadata.binstall]
pkg-fmt = "tgz"
# The binaries are at the top of the archives.
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "https://github.com/wentasah/ctu-quiz/releases/download/v{ version }/quiz-v{ version }-linux-x86_64-gnu.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "https://github.com/wentasah/ctu-quiz/releases/download/v{ version }/quiz-v{ version }-linux-x86_64-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "https://github.com/wentasah/ctu-quiz/releases/download/v{ version }/quiz-v{ version }-macos-universal.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "https://github.com/wentasah/ctu-quiz/releases/download/v{ version }/quiz-v{ version }-macos-universal.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "https://github.com/wentasah/ctu-quiz/releases/download/v{ version }/quiz-v{ version }-windows-x86_64.exe"
# The executable itself, not an archive.
pkg-fmt = "bin"

[features]
default = ["brute", "ods"]
# Support writing the points of a room also in the BRUTE
# (https://brute.fel.cvut.cz) import format: no header, just `login,points`.
# The file is written only when `--brute` (or `brute = true` in the
# configuration) asks for it.
brute = ["dep:zip"]
# Write the points of a room, and how long the students took to answer, also
# as an OpenDocument spreadsheet, with color scales and data bars.
ods = ["dep:spreadsheet-ods", "dep:zip"]

[build-dependencies]
clap.workspace = true
clap_complete.workspace = true
url.workspace = true

[dependencies]
quiz-common.workspace = true

anstream = "1"
anstyle = "1"
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
csv = "1"
open = "5"
openidconnect.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
figment = { version = "0.10.19", features = ["toml"] }
etcetera = "0.10.0"
spreadsheet-ods = { version = "1.0.4", default-features = false, optional = true }
zip = { version = "9.4.1", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
quiz-testsupport.workspace = true
# Only the tests spawn the compiled binary.
tokio = { version = "1", features = ["process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
